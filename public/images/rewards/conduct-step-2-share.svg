<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141b30"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="108" fill="url(#bg2)"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#00C2FF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- subtle connection dots -->
  <circle cx="44" cy="180" r="3" fill="#00C2FF" fill-opacity="0.35"/>
  <circle cx="196" cy="56" r="3" fill="#00C2FF" fill-opacity="0.35"/>
  <line x1="44" y1="180" x2="72" y2="160" stroke="#00C2FF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- link chain icon -->
  <g transform="translate(120,120) rotate(-45)">
    <rect x="-46" y="-16" width="40" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <rect x="6" y="-16" width="40" height="32" rx="16" fill="none" stroke="#00C2FF" stroke-width="6"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- share radiating lines -->
  <g stroke="#00C2FF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
    <circle cx="176" cy="150" r="9" fill="#00C2FF"/>
    <circle cx="176" cy="90" r="7" fill="#0B1020" stroke="#00C2FF"/>
    <circle cx="136" cy="176" r="7" fill="#0B1020" stroke="#00C2FF"/>
    <line x1="176" y1="150" x2="176" y2="90"/>
    <line x1="176" y1="150" x2="136" y2="176"/>
  </g>

  <!-- step number badge -->
  <circle cx="196" cy="196" r="20" fill="#00C2FF"/>
  <text x="196" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1020">2</text>
</svg>
