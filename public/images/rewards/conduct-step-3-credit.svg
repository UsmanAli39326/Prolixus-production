<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141b30"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="108" fill="url(#bg3)"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#00C2FF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- subtle connection dots -->
  <circle cx="46" cy="70" r="3" fill="#00C2FF" fill-opacity="0.35"/>
  <circle cx="192" cy="170" r="3" fill="#00C2FF" fill-opacity="0.35"/>
  <line x1="46" y1="70" x2="76" y2="90" stroke="#00C2FF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- credit / wallet card icon (no coins or cash) -->
  <g transform="translate(120,124)">
    <rect x="-52" y="-34" width="104" height="68" rx="12" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <rect x="-52" y="-18" width="104" height="14" fill="#00C2FF" fill-opacity="0.85"/>
    <rect x="-38" y="14" width="34" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- plus-in-circle badge: credit added -->
  <g transform="translate(174,80)">
    <circle r="22" fill="#00C2FF"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#0B1020" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0B1020" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- step number badge -->
  <circle cx="196" cy="196" r="20" fill="#00C2FF"/>
  <text x="196" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1020">3</text>
</svg>
